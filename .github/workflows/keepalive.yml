name: Keep scheduled runs alive

# GitHub disables scheduled workflows on public repos after 60 days without repository activity.
# This makes one tiny commit a week so the 15-minute refresh in deploy.yml never gets switched off.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%F > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: weekly keepalive" || echo "nothing to commit"
          git push
